name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Ensure D1 Schema Columns
        run: |
          npx wrangler d1 execute portal-etos-id-d1 --remote --command "ALTER TABLE post_test_questions ADD COLUMN test_type TEXT NOT NULL DEFAULT 'POST_TEST';" || true
          npx wrangler d1 execute portal-etos-id-d1 --remote --command "ALTER TABLE post_test_attempts ADD COLUMN test_type TEXT NOT NULL DEFAULT 'POST_TEST';" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
